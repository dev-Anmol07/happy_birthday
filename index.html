<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I made something for you</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --lilac:#8b73c9; --lilac-d:#5d4a9c; --lilac-l:#e4dbf7; --blood:#8a0b16; --blood-d:#6a0810; --wine:#3d0509;
  --card:#fffdf0; --ink:#4b3b82;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;color:#fff1ee;
  background:repeating-linear-gradient(90deg,var(--blood) 0 28px,var(--blood-d) 28px 56px);overflow:hidden}
body::before{content:"";position:fixed;left:-12%;top:-10%;width:60%;height:38%;background:var(--wine);border-radius:0 0 70% 40%;z-index:0}
body::after{content:"";position:fixed;right:-14%;bottom:-8%;width:55%;height:32%;background:var(--wine);border-radius:60% 0 0 0;z-index:0}
.star{position:fixed;color:#ffb3b8;opacity:.55;font-size:18px;z-index:0;pointer-events:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:24px 22px;text-align:center;z-index:1;overflow-y:auto}
.screen.on{display:flex;animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen.on{animation:none}}
h1{font-size:clamp(28px,7vw,48px);line-height:1.1;margin:0;font-weight:800;max-width:15ch}
h2{font-size:clamp(24px,5.5vw,38px);margin:0;font-weight:800}
p{margin:0;font-size:clamp(17px,3.6vw,22px);line-height:1.45;max-width:34ch}
.emoji{font-size:clamp(70px,18vw,120px);line-height:1}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:800;font-size:clamp(20px,4.5vw,28px);color:#fff;background:var(--lilac);
  border:0;border-radius:40px;padding:10px 38px;cursor:pointer;box-shadow:0 5px 0 var(--lilac-d);transition:transform .1s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--lilac-d)}
button:focus-visible,.item:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button.ghost{background:var(--lilac-l);color:var(--ink);box-shadow:0 5px 0 #c4b6ea}
.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;z-index:5;font-size:16px;padding:4px 16px;display:none}
.items{display:flex;gap:clamp(8px,4vw,40px);justify-content:center;flex-wrap:wrap}
.item{background:none;box-shadow:none;color:#fff1ee;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:18px}
.item span:first-child{font-size:clamp(64px,16vw,100px);transition:transform .2s}
.item:hover span:first-child{transform:rotate(-8deg) scale(1.1)}
.item.done::after{content:"opened ✓";font-size:14px;color:#ffb3b8}
.frame{color:var(--ink);background:var(--card);border-radius:22px;padding:18px;box-shadow:0 8px 0 var(--lilac-l),0 0 0 3px var(--lilac) inset;max-width:min(92vw,520px);width:100%}
.letter{text-align:left;max-height:62vh;overflow-y:auto;font-size:clamp(16px,3.4vw,20px);line-height:1.55;font-weight:500;white-space:pre-line}
.search{background:#fff;border-radius:30px;padding:8px 18px;text-align:left;box-shadow:0 2px 8px #0002;margin-bottom:12px;font-weight:500;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid .ph{aspect-ratio:1;border-radius:12px;background:var(--lilac-l);display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}
.grid img,.polaroid img{width:100%;height:100%;object-fit:cover;display:block}
.polaroid{width:min(70vw,260px);aspect-ratio:1;border-radius:16px;overflow:hidden;border:8px solid #fff;box-shadow:0 6px 18px #0003;transform:rotate(-3deg);background:var(--lilac-l);display:flex;align-items:center;justify-content:center;font-size:80px}
.bday{font-size:clamp(34px,9vw,64px);font-weight:800;letter-spacing:.02em;line-height:1}
.bday span:nth-child(3n+1){color:#ffd6d9}.bday span:nth-child(3n+2){color:#ff8fa0}.bday span:nth-child(3n){color:#fff1ee}
.screen{justify-content:safe center}
@media (min-width:900px){
  .screen{gap:22px}
  h1{font-size:56px;max-width:20ch}
  h2{font-size:44px}
  p{font-size:24px;max-width:44ch}
  button{font-size:28px;padding:12px 44px}
  .emoji{font-size:130px}
  .items{gap:64px}
  .item{font-size:22px}
  .item span:first-child{font-size:110px}
  .frame{max-width:680px;padding:28px}
  .letter{font-size:22px;max-height:58vh}
  .search{font-size:20px}
  .grid{gap:14px}
  .polaroid{width:min(36vh,340px)}
  .bday{font-size:80px}
  .back{font-size:18px;padding:6px 20px}
}
@media (max-height:640px){
  .screen{gap:8px;padding:14px 18px}
  .emoji{font-size:56px}
  .polaroid{width:min(40vw,170px)}
  .letter{max-height:50vh}
}
@media (max-width:380px){
  button{padding:8px 26px}
  .grid{gap:6px}
  .frame{padding:14px}
}
</style>
</head>
<body>
<button class="back" id="back" aria-label="Go back">← back</button>

<!-- 1 ask -->
<section class="screen on" id="s-ask">
  <div class="emoji">🦒</div>
  <h1>Hey! I made something for you</h1>
  <p>do you wanna see it?</p>
  <div class="row"><button data-go="yes">Yes</button><button class="ghost" data-go="no">No</button></div>
</section>

<!-- no -->
<section class="screen" id="s-no">
  <h2>SERIOUSLY!? how dare you hmph</h2>
  <div class="emoji">😤🦒</div>
  <button data-go="ask">Go back</button>
</section>

<!-- yes -->
<section class="screen" id="s-yes">
  <div class="emoji">🦒🌼</div>
  <h2>That’s a good girl!</h2>
  <button data-go="card">Click</button>
</section>

<!-- card -->
<section class="screen" id="s-card">
  <div class="bday" id="bday" aria-label="Happy Birthday"></div>
  <div class="polaroid" id="mainPhoto">🎂</div>
  <h2 id="nameLine"></h2>
  <button data-go="menu">Open your surprise</button>
</section>

<!-- menu -->
<section class="screen" id="s-menu">
  <h2>click on each item to open</h2>
  <div class="items">
    <button class="item" data-go="memories"><span>📷</span><span>memories</span></button>
    <button class="item" data-go="letter"><span>💌</span><span>a letter</span></button>
    <button class="item" data-go="wishes"><span>🎁</span><span>for you</span></button>
  </div>
</section>

<!-- memories -->
<section class="screen" id="s-memories">
  <div class="frame">
    <div class="search" id="searchText">🔍 Moments of us…</div>
    <div class="grid" id="grid"></div>
  </div>
  <button data-go="menu">Back to items</button>
</section>

<!-- letter -->
<section class="screen" id="s-letter">
  <div class="frame"><div class="letter" id="letterBody"></div></div>
  <button data-go="menu">Back to items</button>
</section>

<!-- wishes -->
<section class="screen" id="s-wishes">
  <h1 id="wishText"></h1>
  <div class="emoji">🦒🎉</div>
  <button data-go="menu">Back to items</button>
</section>

/* ============================ */

var $ = function(id){return document.getElementById(id)};
var trail = ["ask"];

function show(id){
  document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("on")});
  $("s-"+id).classList.add("on");
  $("back").style.display = (id==="ask"||id==="no"||id==="yes") ? "none" : "block";
  var open = $("s-menu").querySelector('[data-go="'+id+'"]');
  if(open) open.classList.add("done");
}
function go(id){
  if(id==="menu" && trail[trail.length-1]==="menu") return;
  trail.push(id); show(id);
}
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-go]");
  if(b) go(b.getAttribute("data-go"));
});
$("back").addEventListener("click", function(){
  if(trail.length>1) trail.pop();
  show(trail[trail.length-1]);
});

function img(src, alt){ var i=document.createElement("img"); i.src=src; i.alt=alt||""; return i; }

(function build(){
  var word = "Happy Birthday!".split("");
  $("bday").innerHTML = word.map(function(c){return c===" " ? " " : "<span>"+c+"</span>"}).join("");
  $("nameLine").textContent = "for " + CONFIG.name + " 💜";
  $("searchText").textContent = "🔍 " + CONFIG.searchText;
  $("letterBody").textContent = CONFIG.letter.replace(/\{name\}/g, CONFIG.name).replace(/\{from\}/g, CONFIG.from);
  $("wishText").textContent = CONFIG.wishes;
  if(CONFIG.mainPhoto){ $("mainPhoto").textContent=""; $("mainPhoto").appendChild(img(CONFIG.mainPhoto,"Birthday photo")); }
  var fallback = ["👯","🍕","🌅","🎶","📸","✨"];
  CONFIG.photos.forEach(function(src,i){
    var d = document.createElement("div"); d.className="ph";
    if(src) d.appendChild(img(src,"Memory "+(i+1))); else d.textContent = fallback[i%fallback.length];
    $("grid").appendChild(d);
  });
  [[8,12],[88,20],[12,70],[90,60],[50,6],[30,92]].forEach(function(p){
    var s=document.createElement("div"); s.className="star"; s.textContent="★";
    s.style.left=p[0]+"%"; s.style.top=p[1]+"%"; document.body.appendChild(s);
  });
})();
</script>
